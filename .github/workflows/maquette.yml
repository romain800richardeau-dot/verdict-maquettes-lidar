name: Maquette LiDAR

# LE NOM DE CHAQUE FABRICATION PORTE SA DEMANDE (30/09/2026). La fenetre de
# Verdict retrouvait « sa » fabrication en prenant la plus recente lancee apres
# sa demande : avec trois demandes en 17 secondes, un visiteur suivait la
# maquette d un autre. Le nom porte desormais la position et le cote de la
# demande, et la fenetre y lit la sienne. Le Worker n a pas a changer : il
# transmet deja lat, lon et side dans client_payload.
run-name: Maquette LiDAR ${{ github.event.client_payload.lat || github.event.inputs.lat }} ${{ github.event.client_payload.lon || github.event.inputs.lon }} ${{ github.event.client_payload.side || github.event.inputs.side }}

on:
  workflow_dispatch:
    inputs:
      lat:
        description: Latitude WGS84 du site
        required: true
        type: string
      lon:
        description: Longitude WGS84 du site
        required: true
        type: string
      label:
        description: Libelle du site (optionnel)
        required: false
        default: ''
        type: string
      side:
        description: Cote de la fenetre en m (400-2000, defaut 500)
        required: false
        default: '500'
        type: string
  repository_dispatch:
    types: [maquette]
  push:
    branches:
      - main
    paths:
      - 'requests/**.json'

permissions:
  contents: write

# PLUS DE FILE D ATTENTE UNIQUE (30/09/2026). Le groupe « maquette-factory »
# faisait passer les fabrications une par une, et GitHub ne garde qu UNE
# execution en attente par groupe : chaque nouvelle demande annulait celle qui
# attendait (le 30/09 a 17 h 04, #148 et #149 annulees par #150, sans que leurs
# visiteurs le sachent). Les fabrications tournent donc en parallele. Leur seul
# point commun, l enregistrement du resultat dans le depot, se refait sur la
# derniere version de main (voir « Commit et push du resultat »).

jobs:
  maquette:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      # CHECKOUT PARTIEL : le depot pese 200 Mo, dont 169 maquettes deja
      # fabriquees dans glb/. L usine n a besoin que de pipeline/ et de
      # requests/. Sans cela elle telechargeait tout le catalogue a chaque
      # passage (77 s sur 196 mesurees), et cette part grossissait a chaque
      # nouvelle maquette. `filter: blob:none` ne rapatrie que les fichiers
      # reellement sortis du depot.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            pipeline
            requests
          sparse-checkout-cone-mode: true

      - name: Resolution des parametres
        id: params
        shell: bash
        env:
          IN_LAT: ${{ github.event.inputs.lat }}
          IN_LON: ${{ github.event.inputs.lon }}
          IN_LABEL: ${{ github.event.inputs.label }}
          IN_SIDE: ${{ github.event.inputs.side }}
        run: |
          set -euo pipefail
          LAT="" ; LON="" ; LABEL="" ; SIDE="" ; REQUEST_FILE=""
          case "$GITHUB_EVENT_NAME" in
            workflow_dispatch)
              LAT="$IN_LAT" ; LON="$IN_LON" ; LABEL="$IN_LABEL" ; SIDE="$IN_SIDE"
              ;;
            repository_dispatch)
              LAT=$(jq -r '.client_payload.lat // empty' "$GITHUB_EVENT_PATH")
              LON=$(jq -r '.client_payload.lon // empty' "$GITHUB_EVENT_PATH")
              LABEL=$(jq -r '.client_payload.label // empty' "$GITHUB_EVENT_PATH")
              SIDE=$(jq -r '.client_payload.side // empty' "$GITHUB_EVENT_PATH")
              ;;
            push)
              # GOTCHA verifie le 05/07/2026 : sur le runner, head_commit du payload push N'A PAS
              # les champs added/modified (contrairement au webhook documente). On ne parse donc
              # PAS le payload : on traite le plus ANCIEN requests/*.json present dans l'arbre.
              # Le workflow supprime chaque requete traitee -> tout .json present est en attente,
              # et une requete ratee sera rattrapee au declenchement suivant (auto-reparant).
              REQUEST_FILE=$(ls requests/*.json 2>/dev/null | sort | head -n 1 || true)
              if [ -z "$REQUEST_FILE" ] || [ ! -f "$REQUEST_FILE" ]; then
                echo "Push sans fichier requests/*.json exploitable, sortie neutre."
                echo "ok=false" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              LAT=$(jq -r '.lat // empty' "$REQUEST_FILE" 2>/dev/null || true)
              LON=$(jq -r '.lon // empty' "$REQUEST_FILE" 2>/dev/null || true)
              LABEL=$(jq -r '.label // empty' "$REQUEST_FILE" 2>/dev/null || true)
              SIDE=$(jq -r '.side // empty' "$REQUEST_FILE" 2>/dev/null || true)
              ;;
          esac
          if [ -z "$LAT" ] || [ -z "$LON" ]; then
            if [ "$GITHUB_EVENT_NAME" = "push" ]; then
              echo "Requete invalide (lat/lon absents dans $REQUEST_FILE), sortie neutre."
              echo "ok=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Parametres lat/lon manquants." >&2
            exit 1
          fi
          if [ -z "$SIDE" ]; then SIDE=500; fi
          {
            echo "ok=true"
            echo "lat=$LAT"
            echo "lon=$LON"
            echo "label=$LABEL"
            echo "side=$SIDE"
            echo "request_file=$REQUEST_FILE"
          } >> "$GITHUB_OUTPUT"

      - name: Installer Python
        if: steps.params.outputs.ok == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: Installer les dependances Python
        if: steps.params.outputs.ok == 'true'
        shell: bash
        run: python -m pip install -r pipeline/requirements.txt

      - name: Cache du binaire roofer
        if: steps.params.outputs.ok == 'true'
        id: roofer_cache
        uses: actions/cache@v4
        with:
          path: roofer
          key: roofer-linux-v1.0.0

      - name: Installer roofer
        if: steps.params.outputs.ok == 'true' && steps.roofer_cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 -o roofer.tar.gz \
            https://github.com/3DBAG/roofer/releases/download/v1.0.0/roofer-linux-x86_64-v1.0.0.tar.gz
          mkdir -p roofer_extract
          tar xzf roofer.tar.gz -C roofer_extract
          BIN=$(find roofer_extract -type f -name roofer -path '*/bin/*' | head -n 1)
          if [ -z "$BIN" ]; then
            echo "Binaire roofer introuvable dans l'archive :" >&2
            find roofer_extract -maxdepth 3 -print >&2
            exit 1
          fi
          ROOT=$(dirname "$(dirname "$BIN")")
          mkdir -p roofer
          cp -a "$ROOT"/. roofer/
          chmod +x roofer/bin/roofer
          rm -rf roofer_extract roofer.tar.gz

      - name: Verifier roofer
        if: steps.params.outputs.ok == 'true'
        shell: bash
        run: |
          set -euo pipefail
          "$GITHUB_WORKSPACE/roofer/bin/roofer" --version

      - name: Generer la maquette
        if: steps.params.outputs.ok == 'true'
        id: pipeline
        shell: bash
        env:
          ROOFER_BIN: ${{ github.workspace }}/roofer/bin/roofer
          P_LAT: ${{ steps.params.outputs.lat }}
          P_LON: ${{ steps.params.outputs.lon }}
          P_LABEL: ${{ steps.params.outputs.label }}
          P_SIDE: ${{ steps.params.outputs.side }}
        run: |
          set -euo pipefail
          ARGS=(--lat "$P_LAT" --lon "$P_LON" --side "${P_SIDE:-500}")
          if [ -n "$P_LABEL" ]; then
            ARGS+=(--label "$P_LABEL")
          fi
          set +e
          python pipeline/pipeline.py "${ARGS[@]}" | tee pipeline_out.log
          EC=${PIPESTATUS[0]}
          set -e
          if [ "$EC" = "3" ]; then
            echo "Aucun batiment BDTOPO dans la fenetre : pas de maquette a produire (sortie neutre)."
            echo "result=" >> "$GITHUB_OUTPUT"
            echo "key=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$EC" != "0" ]; then
            exit "$EC"
          fi
          RESULT=$(grep '^MAQUETTE_RESULT ' pipeline_out.log | tail -n 1 | sed 's/^MAQUETTE_RESULT //' || true)
          KEY=""
          if [ -n "$RESULT" ]; then
            KEY=$(printf '%s' "$RESULT" | jq -r '.key // empty' || true)
          fi
          {
            echo "result=$RESULT"
            echo "key=$KEY"
          } >> "$GITHUB_OUTPUT"

      - name: Commit et push du resultat
        if: steps.params.outputs.ok == 'true'
        shell: bash
        env:
          REQUEST_FILE: ${{ steps.params.outputs.request_file }}
          KEY: ${{ steps.pipeline.outputs.key }}
          P_LABEL: ${{ steps.params.outputs.label }}
        run: |
          set -euo pipefail
          git config user.name 'maquette-bot'
          git config user.email 'maquette-bot@users.noreply.github.com'
          # PLUSIEURS FABRICATIONS A LA FOIS (30/09/2026). Deux fabrications qui
          # finissent ensemble modifient toutes deux index.json : l ancien
          # « git pull --rebase » s arretait sur ce conflit, et set -e tuait
          # l etape apres une longue reconstruction. On ne rebase donc plus, et
          # on ne touche plus aux fichiers du checkout partiel (un « reset
          # --hard » y effacait glb/, mesure sur banc) : a chaque tentative, le
          # commit est ASSEMBLE dans un index a part, sur la DERNIERE version de
          # main, avec nos seuls fichiers et notre seule entree de l index, puis
          # pousse. Si une fabrication concurrente du MEME site a deja publie sa
          # maquette, on garde la sienne : elle vaut la notre.
          SAUVE="$RUNNER_TEMP/maquette_sortie"
          mkdir -p "$SAUVE"
          if [ -n "$KEY" ]; then
            cp glb/"$KEY".* "$SAUVE"/
            python -c "import json,sys; d=json.load(open('index.json',encoding='utf-8')); json.dump(d[sys.argv[1]],open(sys.argv[2],'w',encoding='utf-8'),ensure_ascii=False)" "$KEY" "$SAUVE/entree.json"
          fi
          MSG="Maquette"
          if [ -n "$KEY" ]; then MSG="$MSG $KEY"; fi
          if [ -n "$P_LABEL" ]; then MSG="$MSG ($P_LABEL)"; fi
          export GIT_INDEX_FILE="$RUNNER_TEMP/index_maquette"
          for i in 1 2 3 4 5 6; do
            git fetch -q --depth=1 origin +refs/heads/main:refs/remotes/origin/main
            rm -f "$GIT_INDEX_FILE"
            git read-tree origin/main
            if [ -n "$KEY" ]; then
              # ls-tree lit l arbre sans rapatrier la maquette elle-meme
              if [ -n "$(git ls-tree origin/main -- "glb/$KEY.glb")" ]; then
                echo "La maquette $KEY est deja publiee par une fabrication concurrente : on garde la sienne."
              else
                for f in "$SAUVE"/"$KEY".*; do
                  git update-index --add --cacheinfo "100644,$(git hash-object -w --no-filters "$f"),glb/$(basename "$f")"
                done
                git show origin/main:index.json > "$SAUVE/index_distant.json"
                python -c "import json,sys; d=json.load(open(sys.argv[3],encoding='utf-8')); d[sys.argv[1]]=json.load(open(sys.argv[2],encoding='utf-8')); f=open(sys.argv[4],'w',encoding='utf-8',newline='\n'); json.dump(d,f,ensure_ascii=False,indent=2,sort_keys=True); f.write('\n'); f.close()" "$KEY" "$SAUVE/entree.json" "$SAUVE/index_distant.json" "$SAUVE/index_fusion.json"
                git update-index --add --cacheinfo "100644,$(git hash-object -w --no-filters "$SAUVE/index_fusion.json"),index.json"
              fi
            fi
            if [ -n "$REQUEST_FILE" ] && [ -n "$(git ls-tree origin/main -- "$REQUEST_FILE")" ]; then
              git update-index --force-remove "$REQUEST_FILE"
            fi
            ARBRE=$(git write-tree)
            if [ "$ARBRE" = "$(git rev-parse 'origin/main^{tree}')" ]; then
              echo "Rien a committer."
              exit 0
            fi
            # [skip ci] : le commit du bot supprime requests/*.json, sans ce marqueur il redeclencherait le workflow pour rien
            COMMIT=$(git commit-tree "$ARBRE" -p origin/main -m "$MSG [skip ci]")
            if git push -q origin "$COMMIT:refs/heads/main"; then
              echo "Maquette publiee (tentative $i)."
              exit 0
            fi
            echo "Push refuse (tentative $i sur 6) : une autre fabrication vient de publier. Nouvel essai sur la version a jour."
            sleep $(( 2 * i + RANDOM % 6 ))
          done
          echo "Push impossible apres 6 tentatives." >&2
          exit 1

      - name: Resume
        if: steps.params.outputs.ok == 'true'
        shell: bash
        env:
          RESULT: ${{ steps.pipeline.outputs.result }}
          KEY: ${{ steps.pipeline.outputs.key }}
          P_LABEL: ${{ steps.params.outputs.label }}
        run: |
          {
            echo "## Maquette LiDAR"
            echo ""
            if [ -n "$P_LABEL" ]; then
              echo "Label : $P_LABEL"
              echo ""
            fi
            if [ -n "$KEY" ]; then
              echo "Cle : \`$KEY\`"
              echo ""
              echo "URL : https://raw.githubusercontent.com/romain800richardeau-dot/verdict-maquettes-lidar/main/glb/$KEY.glb"
              echo ""
            fi
            if [ -n "$RESULT" ]; then
              echo "Statistiques (MAQUETTE_RESULT) :"
              echo ""
              echo '```json'
              printf '%s\n' "$RESULT"
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
